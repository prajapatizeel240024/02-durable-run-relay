<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="1320" height="700" fill="#ffffff"/>
<text x="48" y="56" font-size="27" font-weight="bold" fill="#16191d">What a deployment can be, and what it takes to get there</text>
<text x="48" y="82" font-size="14.5" fill="#6b7280">Four terminal states instead of one. Every transition is a conditional UPDATE the database decides — not a check a worker makes and hopes still holds.</text>
<line x1="48" y1="100" x2="1272" y2="100" stroke="#d8dbe0" stroke-width="1.5"/>
<rect x="96" y="300" width="176" height="66" fill="#f7f8fa" stroke="#c9ccd2" stroke-width="1.4" rx="5"/><text x="184.0" y="330.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#16191d">pending</text><text x="184.0" y="349.0" font-size="11.5" text-anchor="middle" fill="#6b7280">submitted, unclaimed</text>
<rect x="400" y="300" width="220" height="66" fill="#eef3f8" stroke="#a9c0d6" stroke-width="1.4" rx="5"/><text x="510.0" y="330.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#16191d">running</text><text x="510.0" y="349.0" font-size="11.5" text-anchor="middle" fill="#6b7280">leased to one worker</text>
<line x1="272" y1="333" x2="391" y2="333" stroke="#2d5f8a" stroke-width="1.8"/><path d="M 400,333 L 391,328 L 391,338 Z" fill="#2d5f8a"/>
<text x="331" y="322" font-size="11.5" text-anchor="middle" fill="#2d5f8a">claim</text>
<rect x="900" y="158" width="268" height="62" fill="#eef7f1" stroke="#a9ccb7" stroke-width="1.4" rx="5"/><text x="1034.0" y="186.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1d6b41">succeeded</text><text x="1034.0" y="205.0" font-size="11.5" text-anchor="middle" fill="#6b7280">the destination matches</text>
<polyline points="620,333 700,333 700,189 891,189" fill="none" stroke="#1d6b41" stroke-width="1.6"/><path d="M 900,189 L 891,184 L 891,194 Z" fill="#1d6b41"/>
<text x="800.0" y="180" font-size="11.5" text-anchor="middle" fill="#1d6b41">all read back, all match</text>
<rect x="900" y="246" width="268" height="62" fill="#fdf6ec" stroke="#e2c795" stroke-width="1.4" rx="5"/><text x="1034.0" y="274.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#96661a">needs_review</text><text x="1034.0" y="293.0" font-size="11.5" text-anchor="middle" fill="#6b7280">it is there, but not as approved</text>
<polyline points="620,333 700,333 700,277 891,277" fill="none" stroke="#96661a" stroke-width="1.6"/><path d="M 900,277 L 891,272 L 891,282 Z" fill="#96661a"/>
<text x="800.0" y="268" font-size="11.5" text-anchor="middle" fill="#96661a">missing or rewritten</text>
<rect x="900" y="334" width="268" height="62" fill="#f3f4f6" stroke="#c9ccd2" stroke-width="1.4" rx="5"/><text x="1034.0" y="362.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#4b5058">cancelled</text><text x="1034.0" y="381.0" font-size="11.5" text-anchor="middle" fill="#6b7280">stopped; drafts so far reported</text>
<polyline points="620,333 700,333 700,365 891,365" fill="none" stroke="#4b5058" stroke-width="1.6"/><path d="M 900,365 L 891,360 L 891,370 Z" fill="#4b5058"/>
<text x="800.0" y="356" font-size="11.5" text-anchor="middle" fill="#4b5058">cancel() seen</text>
<rect x="900" y="422" width="268" height="62" fill="#fdf5f4" stroke="#dda9a3" stroke-width="1.4" rx="5"/><text x="1034.0" y="450.0" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#a8433a">failed</text><text x="1034.0" y="469.0" font-size="11.5" text-anchor="middle" fill="#6b7280">given up after 3 attempts</text>
<polyline points="620,333 700,333 700,453 891,453" fill="none" stroke="#a8433a" stroke-width="1.6"/><path d="M 900,453 L 891,448 L 891,458 Z" fill="#a8433a"/>
<text x="800.0" y="444" font-size="11.5" text-anchor="middle" fill="#a8433a">3 attempts, parked</text>
<polyline points="510,366 510,424 184,424 184,375" fill="none" stroke="#8b8f96" stroke-width="1.6" stroke-dasharray="5 3"/>
<path d="M 184,366 L 179,375 L 189,375 Z" fill="#8b8f96"/>
<text x="347" y="443" font-size="11.5" text-anchor="middle" fill="#6b7280">error → released with the reason, attempts + 1</text>
<text x="347" y="460" font-size="11.5" text-anchor="middle" fill="#6b7280">one attempt per run per recovery pass, so nothing queues behind it</text>
<rect x="96" y="498" width="1176" height="152" fill="#f7f8fa" stroke="#dcdfe4" stroke-width="1.2" rx="5"/>
<text x="120" y="525" font-size="13" font-weight="bold" fill="#16191d" letter-spacing="1.4">THE GUARDS</text>
<text x="120" y="551" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="bold" fill="#2d5f8a">claim</text>
<text x="230" y="551" font-size="12.5" fill="#3d4249">UPDATE ... WHERE status IN (pending, running) AND attempts &lt; 3 AND (lease free OR expired). rowcount decides the winner, so two workers cannot both hold a run.</text>
<text x="120" y="576" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="bold" fill="#2d5f8a">completion</text>
<text x="230" y="576" font-size="12.5" fill="#3d4249">UPDATE ... WHERE status = running AND lease_owner = me. A worker whose lease was stolen, or whose run was cancelled, may not declare success.</text>
<text x="120" y="601" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="bold" fill="#2d5f8a">cancel</text>
<text x="230" y="601" font-size="12.5" fill="#3d4249">UPDATE ... WHERE status IN (pending, running), rechecked before every destination write. Cancelling a finished deployment is refused — the drafts exist.</text>
<text x="120" y="626" font-size="12.5" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="bold" fill="#2d5f8a">verified</text>
<text x="230" y="626" font-size="12.5" fill="#3d4249">Not a flag anyone sets. It is the result of reading every approved asset back out of the destination and comparing it field by field.</text>
<text x="48" y="682" font-size="12" fill="#9aa0a8">02-durable-run-relay  ·  relay/core.py  ·  checked by OneWorkerAtATime, CancellationSticks, SuccessIsEarned, OneBadRunCannotBlockTheQueue</text>
</svg>